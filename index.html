    // Helper Dynamic Lucide Icon

      return <i data-lucide={name} className={className}></i>;
    };

    // --- SUB-COMPONENTS FOR VIRTUAL LAB ---
    
    const LAB_SOLUTIONS = {
      hcl: { name: 'Asam Klorida (HCl)', type: 'asam', pH: 1, desc: 'Asam Kuat' },
      cuka: { name: 'Asam Asetat (CH₃COOH)', type: 'asam', pH: 3, desc: 'Asam Lemah' },
      jeruk: { name: 'Air Jeruk', type: 'asam', pH: 4, desc: 'Asam Alami' },

      sabun: { name: 'Air Sabun', type: 'basa', pH: 9, desc: 'Basa Lemah' },
      amonia: { name: 'Amonia (NH₄OH)', type: 'basa', pH: 11, desc: 'Basa Sedang' },
      naoh: { name: 'Natrium Hidroksida (NaOH)', type: 'basa', pH: 14, desc: 'Basa Kuat' }
    };

    const LAB_INDICATORS = {
      lakmusMerah: { name: 'Lakmus Merah', test: (pH) => pH > 8 ? '#3b82f6' : '#ef4444', resStr: (pH) => pH > 8 ? 'Biru' : 'Merah' },

      universal: { name: 'Universal', test: (pH) => `hsl(${(14 - pH) * 20}, 80%, 50%)`, resStr: (pH) => 'Warna Spektrum pH ' + pH }
    };

    const ION_SOLUTIONS = {
      hcl: { name: 'Asam Klorida (HCl)', type: 'Asam Kuat', eq: 'HCl → H⁺ + Cl⁻', initialMol: 'HCl', ions: ['H⁺', 'Cl⁻'], alpha: 1.0, ph: 1, info: 'Hampir seluruh partikel HCl mengalami ionisasi menjadi ion H⁺ dan Cl⁻.', ionType: 'H⁺' },
      h2so4: { name: 'Asam Sulfat (H₂SO₄)', type: 'Asam Kuat', eq: 'H₂SO₄ → 2H⁺ + SO₄²⁻', initialMol: 'H₂SO₄', ions: ['2H⁺', 'SO₄²⁻'], alpha: 1.0, ph: 1.5, info: 'Terionisasi sempurna melepaskan banyak ion hidrogen ke dalam larutan.', ionType: 'H⁺' },
      cuka: { name: 'Asam Asetat (CH₃COOH)', type: 'Asam Lemah', eq: 'CH₃COOH ⇌ H⁺ + CH₃COO⁻', initialMol: 'CH₃COOH', ions: ['H⁺', 'CH₃COO⁻'], alpha: 0.15, ph: 3, info: 'Hanya sebagian kecil molekul yang terurai menjadi ion, mayoritas tetap molekul utuh.', ionType: 'H⁺' },
      hf: { name: 'Asam Fluorida (HF)', type: 'Asam Lemah', eq: 'HF ⇌ H⁺ + F⁻', initialMol: 'HF', ions: ['H⁺', 'F⁻'], alpha: 0.1, ph: 3.1, info: 'Asam lemah yang hanya terionisasi sebagian di dalam air.', ionType: 'H⁺' },
      naoh: { name: 'Natrium Hidroksida (NaOH)', type: 'Basa Kuat', eq: 'NaOH → Na⁺ + OH⁻', initialMol: 'NaOH', ions: ['Na⁺', 'OH⁻'], alpha: 1.0, ph: 14, info: 'Hampir seluruh molekul NaOH terurai menjadi ion Na⁺ dan OH⁻.', ionType: 'OH⁻' },
      koh: { name: 'Kalium Hidroksida (KOH)', type: 'Basa Kuat', eq: 'KOH → K⁺ + OH⁻', initialMol: 'KOH', ions: ['K⁺', 'OH⁻'], alpha: 1.0, ph: 13.5, info: 'Terionisasi sempurna menghasilkan banyak ion hidroksida (OH⁻).', ionType: 'OH⁻' },
      nh3: { name: 'Amonia (NH₃)', type: 'Basa Lemah', eq: 'NH₃ + H₂O ⇌ NH₄⁺ + OH⁻', initialMol: 'NH₃', ions: ['NH₄⁺', 'OH⁻'], alpha: 0.15, ph: 11, info: 'Hanya sebagian molekul bereaksi dengan air menghasilkan ion OH⁻.', ionType: 'OH⁻' }
    };

    const App = () => {
      // Mind Map States
      const [expandedNodes, setExpandedNodes] = useState([]);
      const [selectedNode, setSelectedNode] = useState(MINDMAP_DATA);
      const [activeL1Id, setActiveL1Id] = useState(null);
      
      // Viewport States
      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const containerRef = useRef(null);

      // Audio State
      const [isSpeaking, setIsSpeaking] = useState(false);

      // Lab States
      const [activeExp, setActiveExp] = useState(1);
      const [results, setResults] = useState([]);

      // Lab 1 State
      const [l1Sol, setL1Sol] = useState('');
      const [l1Ind, setL1Ind] = useState('');
      const [l1Step, setL1Step] = useState(0); // 0: empty, 1: poured, 2: tested
      
      // Lab 2 State
      const [l2Sol, setL2Sol] = useState('');
      const [l2Measured, setL2Measured] = useState(false);

      // Lab 4 State (Titration)
      const [l4Acid, setL4Acid] = useState(10); // ml
      const [l4BaseAdded, setL4BaseAdded] = useState(0); // drops
      const [l4Ind, setL4Ind] = useState(false);

      // Lab 5 (Ionization) States
      const [l5Sol, setL5Sol] = useState('');
      const [ionoStatus, setIonoStatus] = useState('idle'); // idle, added, playing, paused, done
      const [ionoParticles, setIonoParticles] = useState([]);
      const [ionoStats, setIonoStats] = useState({ ionized: 0, unionized: 0 });

      // Efek Interval Simulasi Ionisasi
      useEffect(() => {
        let interval;
        if (ionoStatus === 'playing') {
          interval = setInterval(() => {
            setIonoParticles(prev => {
              const solData = ION_SOLUTIONS[l5Sol];
              if (!solData) return prev;
              
              const totalMols = 20;
              const targetIonized = Math.round(totalMols * solData.alpha);
              const currentIonized = prev.filter(p => p.state === 'split').length;
              
              if (currentIonized >= targetIonized) {
                setIonoStatus('done');
                return prev;
              }
              
              const molIndex = prev.findIndex(p => p.state === 'mol');
              if (molIndex !== -1) {
                const next = [...prev];
                next[molIndex] = { ...next[molIndex], state: 'split' };
                setIonoStats({ ionized: currentIonized + 1, unionized: totalMols - (currentIonized + 1) });
                return next;
              }
              return prev;
            });
          }, 350); // Kecepatan ionisasi (350ms per molekul)
        }
        return () => clearInterval(interval);
      }, [ionoStatus, l5Sol]);

      // Logging Jurnal Otomatis Setelah Ionisasi
      useEffect(() => {
        if (ionoStatus === 'done' && l5Sol) {
          const sol = ION_SOLUTIONS[l5Sol];
          logResult({ 
            exp: 'Simulasi Ionisasi', 
            desc: `${sol.name} (${sol.type}) selesai diobservasi. Derajat ionisasi mencapai ${(sol.alpha * 100).toFixed(0)}%. Indikator pH menunjukkan angka ${sol.ph}.` 
          });
        }
      }, [ionoStatus, l5Sol]);

      // Layout Calculation
      const calculateLayout = (rootNode, expandedNodeIds) => {
        const layouts = {};
        const levelSpacing = 300;

        const traverse = (node, depth, yOffset) => {
          let x = depth * levelSpacing;
          let y = yOffset;

          if (node.id === 'root') {
            x = 0; y = 0;
          } else if (depth === 1) {
            const numChildren = MINDMAP_DATA.children.length;
            const index = MINDMAP_DATA.children.findIndex(c => c.id === node.id);
            const angle = (index / numChildren) * 2 * Math.PI - Math.PI / 2;
            const radius = 420; // Radius L1 dikembalikan ke posisi semula
            x = radius * Math.cos(angle);
            y = radius * Math.sin(angle);
          } else if (depth === 2) {
            const parent = layouts[node.parentId];
            const numChildren = rootNode.children.find(c => c.id === node.parentId).children.length;
            const index = rootNode.children.find(c => c.id === node.parentId).children.findIndex(c => c.id === node.id);
            
            // Rentang sudut diperlebar & Jarak sub-materi dijauhkan agar tidak saling menimpa
            const angleOffset = (index - (numChildren - 1) / 2) * 0.55; 
            const parentAngle = Math.atan2(parent.y, parent.x);
            const angle = parentAngle + angleOffset;
            const radius = 350; // Radius L2 dibuat lebih jauh dari pusat agar tidak bertabrakan
            
            x = parent.x + radius * Math.cos(angle);
            y = parent.y + radius * Math.sin(angle);
          }

          layouts[node.id] = { id: node.id, x, y, data: node, parentId: node.parentId };

          if (expandedNodeIds.includes(node.id) && node.children) {
            node.children.forEach(child => {
                child.parentId = node.id;
                traverse(child, depth + 1, y);
            });
          }
        };

        MINDMAP_DATA.parentId = null;
        traverse(MINDMAP_DATA, 0, 0);
        return layouts;
      };

      const nodeLayouts = useMemo(() => calculateLayout(MINDMAP_DATA, expandedNodes), [expandedNodes]);

      // Interactions
      const handleNodeClick = (nodeData, e) => {
        e.stopPropagation();
        setSelectedNode(nodeData);
        
        window.speechSynthesis.cancel();
        setIsSpeaking(false);

        if (nodeData.id === 'root') {
            if (expandedNodes.includes('root')) {
              // Jika sudah terbuka, tutup semua sub-materi
              setExpandedNodes([]);
              setActiveL1Id(null);
            } else {
              // Jika masih tertutup, buka sub-materi (L1)
              setExpandedNodes(['root']);
              setActiveL1Id(null);
            }
            return;
        }

        if (nodeData.parentId === 'root') {
          if (expandedNodes.includes(nodeData.id)) {
            // Tutup cabang jika diklik ulang
            setExpandedNodes(['root']);
            setActiveL1Id(null);
          } else {
            // Buka HANYA cabang ini (tutup cabang lain secara otomatis)
            setExpandedNodes(['root', nodeData.id]);
            setActiveL1Id(nodeData.id);
          }
        }
      };

      const handleResetMap = () => {
        setExpandedNodes([]);
        setSelectedNode(MINDMAP_DATA);
        setActiveL1Id(null);
        setZoom(1);
        setPan({ x: 0, y: 0 });
        window.speechSynthesis.cancel();
        setIsSpeaking(false);
      };

      // Drag and pan logic
      const handleMouseDown = (e) => {
        setIsDragging(true);
        setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
      };
      const handleMouseMove = (e) => {
        if (!isDragging) return;
        setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
      };
      const handleMouseUp = () => setIsDragging(false);

      const handleTouchStart = (e) => {
        if (e.touches.length === 1) {
          setIsDragging(true);
          setDragStart({ x: e.touches[0].clientX - pan.x, y: e.touches[0].clientY - pan.y });
        }
      };
      const handleTouchMove = (e) => {
        if (!isDragging) return;
        setPan({ x: e.touches[0].clientX - dragStart.x, y: e.touches[0].clientY - dragStart.y });
      };
      const handleTouchEnd = () => setIsDragging(false);

      // Zoom
      const handleZoomIn = () => setZoom(z => Math.min(z + 0.1, 2));
      const handleZoomOut = () => setZoom(z => Math.max(z - 0.1, 0.3));
      const handleResetZoom = () => { setZoom(1); setPan({x:0, y:0}); };

      // TTS
      const handleSpeak = (text) => {
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.onend = () => setIsSpeaking(false);
        setIsSpeaking(true);
        window.speechSynthesis.speak(utterance);
      };

      // Reset when changing tabs
      useEffect(() => {
        setL1Step(0); setL1Sol(''); setL1Ind('');
        setL2Sol(''); setL2Measured(false);
        setL4BaseAdded(0); setL4Ind(false);
        setL5Sol(''); setIonoStatus('idle'); setIonoParticles([]); setIonoStats({ ionized: 0, unionized: 0 });
      }, [activeExp]);

      const logResult = (data) => setResults(prev => [data, ...prev]);

      // --- EXPERIMENT RENDERERS ---

      const renderLab1 = () => {
        const solData = LAB_SOLUTIONS[l1Sol];
        const indData = LAB_INDICATORS[l1Ind];
        let fluidColor = 'transparent';
        
        if (l1Step >= 1 && solData) fluidColor = 'rgba(255,255,255,0.1)';
        if (l1Step === 2 && solData && indData) fluidColor = indData.test(solData.pH);

        return (
          <div className="flex flex-col lg:flex-row gap-6 animate-fadeIn">
            {/* Tools Area */}
            <div className="w-full lg:w-1/3 bg-slate-800 p-5 rounded-2xl border border-slate-700">
              <h3 className="font-bold text-lg mb-4 text-emerald-400">Pilih Zat Uji</h3>
              
              <label className="block text-xs font-semibold text-slate-400 mb-1">1. Pilih Larutan</label>
              <select className="w-full bg-slate-900 text-white p-2.5 rounded-lg border border-slate-600 mb-4 text-sm"
                value={l1Sol} onChange={(e)=> { setL1Sol(e.target.value); setL1Step(e.target.value ? 1 : 0); }}>
                <option value="">-- Pilih Larutan --</option>
                {Object.entries(LAB_SOLUTIONS).map(([k,v]) => <option key={k} value={k}>{v.name}</option>)}
              </select>

              <label className="block text-xs font-semibold text-slate-400 mb-1">2. Pilih Indikator</label>
              <select className="w-full bg-slate-900 text-white p-2.5 rounded-lg border border-slate-600 mb-6 text-sm"
                value={l1Ind} onChange={(e)=> setL1Ind(e.target.value)} disabled={l1Step === 0}>
                <option value="">-- Pilih Indikator --</option>
                {Object.entries(LAB_INDICATORS).map(([k,v]) => <option key={k} value={k}>{v.name}</option>)}
              </select>

              <button 
                onClick={() => {
                  setL1Step(2);
                  logResult({ exp: 'Uji Indikator', desc: `${solData.name} + ${indData.name} = ${indData.resStr(solData.pH)} (${solData.type.toUpperCase()})` });
                }}
                disabled={!l1Sol || !l1Ind || l1Step === 2}
                className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-xl font-bold transition flex items-center justify-center gap-2"
              >
                <Icon name="droplet" /> Teteskan Indikator
              </button>
            </div>

            {/* Visual Area */}
            <div className="w-full lg:w-2/3 bg-slate-900 rounded-2xl border border-slate-800 p-8 flex flex-col items-center justify-center min-h-[350px]">
              <div className="relative flex flex-col items-center">
                {/* Pipette animation */}
                {l1Step === 2 && (
                  <div className="absolute -top-16 animate-drop">
                    <Icon name="droplet" className="w-6 h-6 text-pink-400 fill-current" />
                  </div>
                )}
                {/* Test Tube */}
                <div className="w-24 h-48 border-4 border-t-0 border-white/20 rounded-b-full relative overflow-hidden bg-white/5 flex items-end shadow-2xl backdrop-blur-sm">
                  {/* Liquid */}
                  <div className="w-full transition-all duration-1000 ease-in-out relative" style={{ height: l1Step > 0 ? '60%' : '0%', backgroundColor: fluidColor }}>
                    {l1Step > 0 && <div className="absolute top-0 left-0 w-full h-2 bg-white/20 rounded-full"></div>}
                  </div>
                </div>
              </div>
              
              <div className="mt-8 text-center h-16">
                {l1Step === 2 ? (
                  <div className="bg-slate-800 px-6 py-3 rounded-xl border border-slate-700">
                    <p className="font-bold text-white">Hasil: {indData?.resStr(solData?.pH)}</p>
                    <p className="text-sm text-emerald-400 mt-1">Kesimpulan: Cairan bersifat {solData?.type}</p>
                  </div>
                ) : (
                  <p className="text-slate-400 text-sm">Siapkan tabung reaksi dan masukkan larutan.</p>
                )}
              </div>
            </div>
          </div>
        );
      };

      const renderLab2 = () => {
        const solData = LAB_SOLUTIONS[l2Sol];
        return (
          <div className="flex flex-col lg:flex-row gap-6 animate-fadeIn">
            <div className="w-full lg:w-1/3 bg-slate-800 p-5 rounded-2xl border border-slate-700">
              <h3 className="font-bold text-lg mb-4 text-cyan-400">Pengukuran pH</h3>
              <select className="w-full bg-slate-900 text-white p-2.5 rounded-lg border border-slate-600 mb-6 text-sm"
                value={l2Sol} onChange={(e)=> { setL2Sol(e.target.value); setL2Measured(false); }}>
                <option value="">-- Pilih Cairan Uji --</option>
                {Object.entries(LAB_SOLUTIONS).map(([k,v]) => <option key={k} value={k}>{v.name}</option>)}
              </select>
              <button 
                onClick={() => {
                  setL2Measured(true);
                  logResult({ exp: 'Ukur pH Meter', desc: `pH dari ${solData.name} adalah ${solData.pH} (${solData.type})` });
                }}
                disabled={!l2Sol || l2Measured}
                className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 disabled:bg-slate-700 text-white rounded-xl font-bold transition flex items-center justify-center gap-2"
              >
                <Icon name="gauge" /> Celupkan pH Meter
              </button>
            </div>
            <div className="w-full lg:w-2/3 bg-slate-900 rounded-2xl border border-slate-800 p-8 flex flex-col items-center justify-center min-h-[350px]">
              {/* Digital Meter Display */}
              <div className="mb-6 w-48 bg-black border-4 border-slate-600 rounded-xl p-4 flex justify-center shadow-lg shadow-cyan-500/20">
                <span className={`font-mono text-4xl font-bold ${l2Measured ? 'text-green-400' : 'text-slate-700'}`}>
                  {l2Measured ? solData.pH.toFixed(1) : '--.-'}
                </span>
              </div>
              
              {/* Beaker & Probe */}
              <div className="relative">
                {/* Probe */}
                <div className={`absolute left-1/2 -translate-x-1/2 w-4 bg-slate-400 rounded-b-lg transition-all duration-700 z-10 ${l2Measured ? 'h-32 -top-10' : 'h-16 -top-20'}`}>
                  <div className="absolute bottom-0 w-full h-4 bg-red-500 rounded-b-lg"></div>
                </div>
                {/* Beaker */}
                <div className="w-32 h-32 border-4 border-t-0 border-white/30 rounded-b-2xl relative overflow-hidden bg-white/5 flex items-end">
                  <div className="w-full h-2/3 bg-blue-400/20 relative">
                     <div className="absolute top-0 left-0 w-full h-1 bg-white/30 rounded-full"></div>
                  </div>
                </div>
              </div>
              <p className="mt-6 text-sm text-slate-400">{l2Measured ? `Sifat cairan: ${solData.type.toUpperCase()}` : 'Probe pH Meter siap digunakan.'}</p>
            </div>
          </div>
        )
      };

      const renderLab4 = () => {
        // Titration Math: Start pH = 1. End pH = 13. Base adds OH-.
        const baseDrops = l4BaseAdded;
        let currentPH = 1;
        if (baseDrops > 0 && baseDrops < 10) currentPH = 1 + (baseDrops * 0.4);
        if (baseDrops === 10) currentPH = 7.0; // Equivalence point
        if (baseDrops > 10) currentPH = 12 + ((baseDrops-10) * 0.2);

        const isNeutral = currentPH === 7.0;
        const color = l4Ind ? LAB_INDICATORS.pp.test(currentPH) : 'transparent';
        const displayColor = color === 'transparent' ? 'rgba(255,255,255,0.1)' : color;

        return (
          <div className="flex flex-col lg:flex-row gap-6 animate-fadeIn">
            <div className="w-full lg:w-1/3 bg-slate-800 p-5 rounded-2xl border border-slate-700">
              <h3 className="font-bold text-lg mb-2 text-indigo-400">Reaksi Netralisasi (Titrasi)</h3>
              <p className="text-xs text-slate-400 mb-6">Larutan Asam (HCl) diteteskan Basa (NaOH).</p>

              <div className="mb-4">
                <label className="flex items-center gap-2 text-sm text-slate-300 bg-slate-900 p-3 rounded-lg border border-slate-700 cursor-pointer hover:bg-slate-700/50">
                  <input type="checkbox" checked={l4Ind} onChange={(e)=>setL4Ind(e.target.checked)} className="w-4 h-4 accent-pink-500" />
                  Tambahkan Indikator PP
                </label>
              </div>

              <button 
                onClick={() => {
                  setL4BaseAdded(prev => prev + 1);
                  if (baseDrops + 1 === 10) logResult({ exp: 'Titrasi', desc: 'Mencapai titik netralisasi / ekuivalen (pH 7.0)' });
                }}
                disabled={baseDrops >= 20}
                className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 text-white rounded-xl font-bold transition flex items-center justify-center gap-2 shadow-lg active:scale-95"
              >
                <Icon name="arrow-downToLine" /> Teteskan NaOH (1 ml)
              </button>

              <div className="mt-6 flex justify-between text-xs font-bold text-slate-400 bg-slate-900 p-3 rounded-lg">
                <span>Volume Asam: 10 ml</span>
                <span>Basa Diteteskan: {baseDrops} ml</span>
              </div>
            </div>

            <div className="w-full lg:w-2/3 bg-slate-900 rounded-2xl border border-slate-800 p-8 flex flex-col items-center min-h-[400px]">
              <div className="flex justify-between w-full mb-4 px-8">
                <div className="bg-black border border-slate-700 p-3 rounded-xl flex gap-3 items-center">
                  <Icon name="activity" className={`w-5 h-5 ${isNeutral ? 'text-green-400' : 'text-blue-400'}`} />
                  <span className="font-mono text-xl font-bold text-white">pH: {currentPH.toFixed(1)}</span>
                </div>
                {isNeutral && <div className="bg-green-600 text-white px-4 py-2 rounded-xl font-bold animate-pulse">TITIK NETRAL (Garam)</div>}
              </div>

              <div className="relative flex flex-col items-center mt-4">
                {/* Buret Tip */}
                <div className="w-3 h-16 bg-slate-300 rounded-b border-b-4 border-slate-500 mb-2 relative">
                  <div className="absolute top-2 w-8 h-2 bg-red-500 -left-2.5 rounded-full cursor-pointer hover:bg-red-400"></div>
                </div>
                
                {/* Erlenmeyer Flask */}
                <div className="relative w-32 flex flex-col items-center">
                  <div className="w-8 h-12 border-l-4 border-r-4 border-white/20 bg-white/5"></div>
                  <div className="w-0 h-0 border-l-[40px] border-r-[40px] border-b-[60px] border-l-transparent border-r-transparent border-b-white/20 drop-shadow-2xl relative flex justify-center">
                    <div className="absolute top-4 w-[60px] h-[50px] transition-all duration-700 ease-in-out opacity-80" 
                         style={{ backgroundColor: displayColor, borderBottomLeftRadius: '10px', borderBottomRightRadius: '10px' }}>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )
      };

      const renderLab5 = () => {
        const solData = l5Sol ? ION_SOLUTIONS[l5Sol] : null;
        const totalParticles = 20;
        const targetIonized = solData ? Math.round(totalParticles * solData.alpha) : 0;
        const progress = targetIonized > 0 ? (ionoStats.ionized / targetIonized) : 0;
        
        // Kalkulasi dinamis pH yang mengarah ke pH akhir saat ionisasi berlangsung
        const currentPH = solData ? (7 + (solData.ph - 7) * progress) : 7;
        
        const handleTambahkanAir = () => {
            const newParticles = Array.from({length: totalParticles}).map((_, i) => ({
                id: i,
                state: 'mol',
                delay: (Math.random() * 3).toFixed(2),
                x: (15 + Math.random() * 70).toFixed(2), // Scatter 15% - 85% area
                y: (20 + Math.random() * 65).toFixed(2)
            }));
            setIonoParticles(newParticles);
            setIonoStatus('added');
            setIonoStats({ ionized: 0, unionized: totalParticles });
        };

        const Particle = ({ p }) => {
            if (p.state === 'mol') {
                return (
                    <div className="absolute transition-all duration-500 animate-float-random z-10"
                         style={{ left: `${p.x}%`, top: `${p.y}%`, animationDelay: `${p.delay}s` }}>
                         <span className="bg-slate-200 text-slate-900 px-1.5 py-0.5 rounded text-[10px] font-bold border border-slate-400 shadow-md whitespace-nowrap">
                            {solData.initialMol}
                         </span>
                    </div>
                );
            }
            // Ions state (Pisah menjadi 2 bagian kation dan anion)
            return (
                <>
                    <div className="absolute transition-all duration-700 animate-float-random z-20"
                         style={{ left: `calc(${p.x}% - 14px)`, top: `calc(${p.y}% - 10px)`, animationDelay: `${p.delay}s` }}>
                         <span className="bg-red-500 text-white w-6 h-6 flex items-center justify-center rounded-full text-[9px] font-bold shadow-lg border border-red-400">
                            {solData.ions[0]}
                         </span>
                    </div>
                    <div className="absolute transition-all duration-700 animate-float-random z-20"
                         style={{ left: `calc(${p.x}% + 14px)`, top: `calc(${p.y}% + 10px)`, animationDelay: `${parseFloat(p.delay)+0.5}s` }}>
                         <span className="bg-blue-500 text-white w-6 h-6 flex items-center justify-center rounded-full text-[9px] font-bold shadow-lg border border-blue-400">
                            {solData.ions[1]}
                         </span>
                    </div>
                </>
            );
        };

        return (
          <div className="flex flex-col lg:flex-row gap-6 animate-fadeIn">
            {/* Panel Kontrol */}
            <div className="w-full lg:w-1/3 flex flex-col gap-4">
              <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                <h3 className="font-bold text-lg mb-4 text-amber-400 flex items-center gap-2"><Icon name="microscope" /> Kontrol Simulasi</h3>
                <label className="block text-xs font-semibold text-slate-400 mb-2">Pilih Zat Terlarut</label>
                <select 
                  className="w-full bg-slate-900 text-white p-2.5 rounded-lg border border-slate-600 mb-6 text-sm outline-none focus:border-amber-500 transition"
                  value={l5Sol} 
                  onChange={(e)=> { setL5Sol(e.target.value); setIonoStatus('idle'); setIonoParticles([]); setIonoStats({ ionized: 0, unionized: 0}); }}
                  disabled={ionoStatus === 'playing' || ionoStatus === 'paused'}
                >
                  <option value="">-- Pilih Larutan --</option>
                  {Object.entries(ION_SOLUTIONS).map(([k,v]) => <option key={k} value={k}>{v.name}</option>)}
                </select>
                
                <div className="grid grid-cols-2 gap-3 mb-2">
                  <button onClick={handleTambahkanAir} disabled={!l5Sol || ionoStatus !== 'idle'} className="col-span-2 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-2 shadow-md">
                     <Icon name="droplet" className="w-4 h-4"/> Tambahkan ke Air
                  </button>
                  <button onClick={() => setIonoStatus('playing')} disabled={ionoStatus !== 'added' && ionoStatus !== 'paused'} className="py-2 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-1 shadow-md">
                     ▶️ Mulai
                  </button>
                  <button onClick={() => setIonoStatus('paused')} disabled={ionoStatus !== 'playing'} className="py-2 bg-amber-600 hover:bg-amber-500 disabled:bg-slate-700 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-1 shadow-md">
                     ⏸️ Jeda
                  </button>
                  <button onClick={() => { setIonoStatus('idle'); setIonoParticles([]); setIonoStats({ionized:0, unionized:0}); }} disabled={ionoStatus === 'idle'} className="col-span-2 py-2.5 bg-slate-600 hover:bg-slate-500 disabled:bg-slate-700 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-2 shadow-md mt-2">
                     🔄 Ulangi Simulasi
                  </button>
                </div>
              </div>

              {/* Panel Informasi */}
              {solData && (
                <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 text-sm animate-fadeIn">
                  <div className="mb-3">
                     <span className="text-slate-400 text-xs uppercase font-bold tracking-wider">Karakteristik Zat</span>
                     <div className="font-bold text-white text-lg mt-0.5">{solData.name} <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full ml-2 align-middle">{solData.type}</span></div>
                  </div>
                  <div className="mb-4">
                     <span className="text-slate-400 text-xs uppercase font-bold tracking-wider">Persamaan Ionisasi</span>
                     <div className="font-mono text-amber-300 font-bold mt-1.5 bg-slate-900 p-3 rounded-lg border border-slate-700 text-center text-base shadow-inner">{solData.eq}</div>
                  </div>
                  
                  {/* Derajat Ionisasi & Status */}
                  <div className="space-y-3 mt-5 border-t border-slate-700 pt-4">
                    <div className="flex justify-between items-center text-xs text-slate-300 font-bold">
                       <span>Molekul Utuh: <span className="text-white text-lg ml-1 font-mono">{ionoStats.unionized}</span></span>
                       <span>Pasangan Ion: <span className="text-blue-400 text-lg ml-1 font-mono">{ionoStats.ionized}</span></span>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-2.5 border border-slate-700 overflow-hidden shadow-inner">
                       <div className="bg-gradient-to-r from-blue-600 to-cyan-400 h-2.5 rounded-full transition-all duration-500" style={{ width: `${(ionoStats.ionized / totalParticles) * 100}%` }}></div>
                    </div>
                    <div className="text-[10px] text-right text-slate-400">Derajat Ionisasi (α) : <strong>{(ionoStats.ionized / totalParticles).toFixed(2)}</strong></div>
                  </div>
                </div>
              )}
            </div>

            {/* Visualisasi Beaker */}
            <div className="w-full lg:w-2/3 flex flex-col items-center justify-center bg-slate-900 rounded-2xl border border-slate-800 p-6 min-h-[450px]">
              
              {/* Header Visualisasi (Info & pH) */}
              <div className="w-full flex justify-between items-start mb-6">
                  <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 max-w-[65%] text-xs text-slate-300 leading-relaxed shadow-lg">
                      {solData ? (
                        <>
                          <p><strong>Proses:</strong> {solData.info}</p>
                          {ionoStatus === 'done' && (
                              <p className="mt-3 text-emerald-400 font-medium bg-emerald-900/20 p-2 rounded border border-emerald-900/50">
                                  <strong>Kesimpulan pH:</strong> {solData.ionType === 'H⁺' ? 'Semakin banyak ion H⁺ terlepas di dalam air, sifat asam semakin kuat sehingga nilai pH semakin turun.' : 'Semakin banyak ion OH⁻ terlepas di air, sifat basa semakin kuat sehingga nilai pH semakin naik.'}
                              </p>
                          )}
                        </>
                      ) : (
                          <p className="text-slate-400">Pilih larutan di panel kiri lalu tekan "Tambahkan ke Air" untuk melihat simulasi molekuler.</p>
                      )}
                  </div>
                  
                  {/* pH Indicator Live */}
                  <div className={`transition-all duration-500 ${ionoStatus !== 'idle' ? 'opacity-100 scale-100' : 'opacity-0 scale-95'}`}>
                      <div className="bg-black border-2 border-slate-700 rounded-xl p-3 flex flex-col items-center min-w-[90px] shadow-lg shadow-cyan-900/20">
                          <span className="text-[10px] text-slate-400 uppercase font-bold mb-1 tracking-widest flex items-center gap-1"><Icon name="activity" className="w-3 h-3 text-cyan-400"/> Live pH</span>
                          <span className={`font-mono text-3xl font-bold transition-colors duration-300 ${currentPH < 6.8 ? 'text-red-400' : currentPH > 7.2 ? 'text-blue-400' : 'text-green-400'}`}>
                              {currentPH.toFixed(1)}
                          </span>
                      </div>
                  </div>
              </div>

              {/* Gelas Beker */}
              <div className="relative mt-auto mb-4">
                  <div className="w-72 h-72 border-4 border-t-0 border-white/30 rounded-b-[2rem] relative overflow-hidden flex items-end shadow-[0_0_40px_rgba(0,0,0,0.5)] bg-gradient-to-b from-transparent to-white/5 backdrop-blur-sm z-0">
                      {/* Animasi air bergelombang sederhana (css trick) */}
                      <div className={`absolute top-0 left-0 w-[200%] h-4 rounded-full opacity-30 bg-blue-300/30 blur-sm transition-all duration-1000 ${ionoStatus !== 'idle' ? 'translate-y-[15%]' : '-translate-y-full'}`}></div>
                      
                      {/* Cairan */}
                      <div className={`w-full h-[85%] relative border-t border-blue-300/30 transition-colors duration-1000 ${ionoStatus !== 'idle' ? 'bg-blue-500/10' : 'bg-transparent'}`}>
                          {/* Partikel Render */}
                          {ionoParticles.map(p => <Particle key={p.id} p={p} />)}
                      </div>
                  </div>
                  <div className="absolute top-4 w-72 text-center pointer-events-none">
                    {ionoStatus === 'idle' && <span className="text-sm font-bold text-slate-500/50">Gelas Beaker (Air Murni)</span>}
                  </div>
              </div>
            </div>
          </div>
        )
      };

      // --- END LAB COMPONENTS ---

      // Render fungsi Panel Mind Map vs Panel Lab
      const renderContent = () => {
        if (expandedNodes.length > 0 && expandedNodes.includes('9')) {
          // MODE VIRTUAL LAB
          return (
            <div key="virtual-lab-view" className="w-full h-full bg-slate-950 flex flex-col lg:flex-row absolute inset-0 z-50 overflow-y-auto lg:overflow-hidden">
              {/* Sidebar Lab */}
              <div className="w-full lg:w-64 bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-800 flex flex-col">
                <div className="p-4 border-b border-slate-800">
                  <button onClick={() => { setExpandedNodes(['root']); setZoom(1); setPan({x:0, y:0}); }} className="flex items-center gap-2 text-sm text-slate-400 hover:text-white transition group font-semibold">
                    <Icon name="arrow-left" className="w-4 h-4 group-hover:-translate-x-1 transition" /> Kembali ke Teori
                  </button>
                </div>
                <div className="p-4">
                  <h2 className="text-xs font-bold text-slate-500 tracking-widest mb-4">DAFTAR PRAKTIKUM</h2>
                  <nav className="space-y-2">
                    {[
                      {id: 1, name: 'Uji Indikator Cair', icon: 'pipette'},
                      {id: 2, name: 'Pengukuran pH Digital', icon: 'gauge'},
                      {id: 4, name: 'Titrasi Asam Basa', icon: 'combine'},
                      {id: 5, name: 'Simulasi Ionisasi', icon: 'microscope'}
                    ].map(tab => (
                      <button key={tab.id} onClick={() => setActiveExp(tab.id)} 
                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold transition ${activeExp===tab.id ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>
                        <Icon name={tab.icon} className="w-4 h-4" /> {tab.name}
                      </button>
                    ))}
                  </nav>
                </div>
              </div>

              {/* Main Lab Area */}
              <div className="flex-1 bg-slate-950 p-6 lg:p-8 overflow-y-auto">
                <div className="max-w-5xl mx-auto space-y-6">
                  <div className="bg-gradient-to-r from-slate-900 to-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <div className="flex items-center gap-3 mb-2">
                      <div className="p-2 bg-blue-500/20 text-blue-400 rounded-lg"><Icon name="beaker" /></div>
                      <h2 className="text-2xl font-bold text-white">Meja Praktikum Virtual</h2>
                    </div>
                    <p className="text-slate-400 text-sm ml-12">Pilih alat dan bahan, lakukan simulasi, dan catat hasil pengamatan Anda di bawah.</p>
                  </div>

                  {/* Render the Active Experiment */}
                  {activeExp === 1 && renderLab1()}
                  {activeExp === 2 && renderLab2()}
                  {activeExp === 4 && renderLab4()}
                  {activeExp === 5 && renderLab5()}

                  {/* Tabel Jurnal Hasil */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 mt-8 shadow-lg">
                    <h3 className="font-bold text-lg mb-4 flex items-center gap-2"><Icon name="clipboard-list" className="text-slate-400" /> Jurnal Hasil Pengamatan</h3>
                    {results.length === 0 ? (
                      <div className="text-center p-6 border-2 border-dashed border-slate-800 rounded-xl text-slate-500 text-sm">Belum ada percobaan yang dilakukan.</div>
                    ) : (
                      <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left text-slate-300">
                          <thead className="bg-slate-800 text-slate-400">
                            <tr><th className="px-4 py-3 rounded-tl-lg">Percobaan</th><th className="px-4 py-3 rounded-tr-lg">Catatan Hasil</th></tr>
                          </thead>
                          <tbody>
                            {results.map((r, i) => (
                              <tr key={i} className="border-b border-slate-800"><td className="px-4 py-3 font-semibold text-blue-400">{r.exp}</td><td className="px-4 py-3">{r.desc}</td></tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>

                </div>
              </div>
            </div>
          );
        }

        // MODE MIND MAP NORMAL (DENGAN PANEL KANAN)
        return (
          <div key="mind-map-view" className="flex flex-col lg:flex-row h-full w-full relative">
            {/* AREA CANVAS UTAMA MIND MAP */}
            <div 
              ref={containerRef}
              className="flex-1 h-full relative cursor-grab active:cursor-grabbing bg-grid-pattern overflow-hidden touch-none"
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onMouseLeave={handleMouseUp}
              onTouchStart={handleTouchStart}
              onTouchMove={handleTouchMove}
              onTouchEnd={handleTouchEnd}
              onTouchCancel={handleTouchEnd}
            >
              
              {/* KONTROL ZOOM */}
              <div className="absolute bottom-6 left-6 z-20 flex flex-col gap-2 bg-slate-900/90 border border-slate-800 p-2 rounded-xl backdrop-blur-md shadow-xl">
                <button onClick={handleZoomIn} className="control-btn p-2 hover:bg-slate-800 text-slate-300 hover:text-white rounded-lg transition" title="Zoom In"><Icon name="zoom-in" className="w-5 h-5" /></button>
                <button onClick={handleZoomOut} className="control-btn p-2 hover:bg-slate-800 text-slate-300 hover:text-white rounded-lg transition" title="Zoom Out"><Icon name="zoom-out" className="w-5 h-5" /></button>
                <button onClick={handleResetZoom} className="control-btn p-2 hover:bg-slate-800 text-slate-300 hover:text-white rounded-lg transition" title="Reset Tampilan"><Icon name="maximize-2" className="w-4 h-4" /></button>
              </div>

              {/* PETUNJUK PENGGUNAAN */}
              <div className="absolute top-20 left-6 z-10 pointer-events-none hidden sm:block">
                <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-900/70 border border-slate-800 rounded-lg text-xs text-slate-400 backdrop-blur-sm shadow-md">
                  <Icon name="mouse-pointer" className="w-4 h-4 text-blue-400 animate-bounce" />
                  <span>Klik "ASAM DAN BASA" di tengah untuk mulai • Usap/Drag latar untuk menggeser</span>
                </div>
              </div>

              {/* CANVAS SVG & NODE MIND MAP */}
              <div className="w-full h-full flex items-center justify-center transition-transform duration-75" style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`, transformOrigin: 'center center' }}>
                <div className="relative w-0 h-0">
                  
                  {/* GARIS PENGHUBUNG SVG */}
                  <svg className="absolute -translate-x-1/2 -translate-y-1/2 overflow-visible pointer-events-none" style={{ width: '4000px', height: '4000px' }}>
                    <defs>
                      <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#3b82f6" stopOpacity="0.8" />
                        <stop offset="100%" stopColor="#8b5cf6" stopOpacity="0.8" />
                      </linearGradient>
                    </defs>
                    {Object.entries(nodeLayouts).map(([id, node]) => {
                      if (id === 'root' || !node.parentId) return null;
                      const parent = nodeLayouts[node.parentId];
                      if (!parent) return null;

                      const isL1Line = node.parentId === 'root';
                      const isInactiveLine = activeL1Id && isL1Line && id !== activeL1Id;

                      const dx = node.x - parent.x;
                      const dy = node.y - parent.y;
                      const cx1 = parent.x + dx * 0.5;
                      const cy1 = parent.y;
                      const cx2 = parent.x + dx * 0.5;
                      const cy2 = node.y;

                      const isSelected = selectedNode?.id === id;

                      return (
                        <g key={`line-${id}`}>
                          <path
                            d={`M ${parent.x + 2000} ${parent.y + 2000} C ${cx1 + 2000} ${cy1 + 2000}, ${cx2 + 2000} ${cy2 + 2000}, ${node.x + 2000} ${node.y + 2000}`}
                            fill="none"
                            stroke={isSelected ? '#60a5fa' : '#334155'}
                            strokeWidth={isSelected ? '3.5' : '2'}
                            strokeOpacity={isInactiveLine ? '0.15' : (isSelected ? '1' : '0.7')}
                            strokeDasharray={isSelected ? 'none' : '4 4'}
                            className="connector-line"
                          />
                        </g>
                      );
                    })}
                  </svg>

                  {/* RENDER SEMUA NODE AKTIF */}
                  {Object.entries(nodeLayouts).map(([id, nodeObj]) => {
                    const { x, y, data } = nodeObj;
                    const isRoot = id === 'root';
                    const isSubbab = nodeObj.parentId === 'root';
                    const isSubmateri = nodeObj.parentId && nodeObj.parentId !== 'root';
                    
                    const isSelected = selectedNode?.id === id;
                    const isExpanded = expandedNodes.includes(id);
                    const hasChildren = data.children && data.children.length > 0;

                    const isInactiveL1 = activeL1Id && isSubbab && id !== activeL1Id;
                    const zIndexClass = isInactiveL1 ? 'z-0' : (isSubmateri ? 'z-20' : (isRoot ? 'z-30' : 'z-10'));

                    let nodeStyleClasses = '';
                    if (isRoot) {
                      nodeStyleClasses = 'px-8 py-5 text-lg font-extrabold bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white border-blue-400 shadow-blue-500/40 animate-pulse-slow scale-110';
                    } else if (isSubbab) {
                      nodeStyleClasses = `bg-gradient-to-r ${data.color || 'from-indigo-600 to-blue-600'} text-white border-2 ${data.borderColor || 'border-indigo-400'} shadow-lg`;
                    } else if (isSubmateri) {
                      nodeStyleClasses = `bg-slate-900/95 text-slate-200 border-2 ${data.borderColor || 'border-slate-700'} shadow-md`;
                    }

                    return (
                      <div
                        key={id}
                        onClick={(e) => handleNodeClick(data, e)}
                        style={{
                          transform: `translate(${x}px, ${y}px) translate(-50%, -50%)`,
                          transition: 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)'
                        }}
                        className={`mindmap-node absolute cursor-pointer group ${zIndexClass}`}
                      >
                        <div className={`
                          relative flex items-center gap-2.5 px-4 py-3 rounded-2xl transition-all duration-300 backdrop-blur-md
                          ${nodeStyleClasses}
                          ${isSelected ? 'ring-4 ring-blue-400/60 scale-105 bg-slate-800 border-white text-white' : 'hover:scale-105'}
                          ${isInactiveL1 ? 'opacity-25 blur-[1.5px] scale-90 hover:opacity-100 hover:blur-none hover:scale-100' : ''}
                        `}>
                          <div className={`p-2 rounded-xl ${isSubbab ? 'bg-black/20 border border-white/20' : 'bg-slate-800/80 border border-slate-700'}`}>
                            <Icon name={data.icon || 'atom'} className={`${isRoot ? 'w-7 h-7 text-blue-300' : isSubbab ? 'w-5 h-5 text-white' : 'w-5 h-5 text-sky-400'}`} />
                          </div>
                          <span className={`whitespace-nowrap font-semibold ${isRoot ? 'text-xl tracking-wide' : isSubbab ? 'text-sm font-bold tracking-wide' : 'text-xs text-slate-200'}`}>
                            {data.label}
                          </span>
                          {hasChildren && !isRoot && (
                            <span className={`ml-1 w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold transition-all ${isExpanded ? 'bg-white text-indigo-900 rotate-90' : 'bg-black/20 text-white group-hover:bg-white/30'}`}>›</span>
                          )}
                          {isSelected && <div className="absolute -inset-0.5 rounded-2xl bg-gradient-to-r from-blue-500 to-purple-500 opacity-40 blur -z-10 animate-pulse"></div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* PANEL KANAN: DETAIL INFORMASI MATERI */}
            <div className="w-full lg:w-[420px] h-[45vh] lg:h-full bg-slate-900/95 border-t lg:border-t-0 lg:border-l border-slate-800 flex flex-col z-30 shadow-2xl backdrop-blur-xl">
              
              <div className="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
                <div className="flex items-center gap-2">
                  <Icon name="book-open-check" className="w-5 h-5 text-blue-400" />
                  <span className="font-bold text-slate-200 text-sm tracking-wider uppercase">Panel Informasi</span>
                </div>
                {selectedNode && (
                  <button onClick={() => handleSpeak(`${selectedNode.info?.title}. ${selectedNode.info?.description || ''}`)} className={`p-2 rounded-lg transition-all flex items-center gap-1.5 text-xs font-medium ${isSpeaking ? 'bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'}`} title="Dengarkan Penjelasan">
                    <Icon name={isSpeaking ? "volume-x" : "volume-2"} className="w-4 h-4" /> <span>{isSpeaking ? "Batal" : "Baca"}</span>
                  </button>
                )}
              </div>

              <div className="flex-1 overflow-y-auto p-6 space-y-6">
                {selectedNode ? (
                  <div className="space-y-5 animate-fadeIn">
                    {selectedNode.info?.tag && <span className="inline-block px-3 py-1 bg-blue-500/10 border border-blue-500/30 text-blue-400 rounded-full text-xs font-semibold">{selectedNode.info.tag}</span>}
                    
                    <div>
                      <h2 className="text-2xl font-bold text-white flex items-center gap-2">{selectedNode.info?.title || selectedNode.label}</h2>
                      {selectedNode.info?.subtitle && <p className="text-sm text-indigo-400 font-medium mt-1">{selectedNode.info.subtitle}</p>}
                    </div>

                    {selectedNode.info?.description && <div className="p-4 bg-slate-800/60 rounded-xl border border-slate-700/60 text-slate-300 text-sm leading-relaxed">{selectedNode.info.description}</div>}

                    {selectedNode.info?.details && selectedNode.info.details.length > 0 && (
                      <div className="space-y-2">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5"><Icon name="list-checks" className="w-4 h-4 text-blue-400" /> Poin-Poin Utama</h3>
                        <ul className="space-y-2">
                          {selectedNode.info.details.map((point, idx) => (
                            <li key={idx} className="flex items-start gap-2 text-sm text-slate-300 bg-slate-950/40 p-2.5 rounded-lg border border-slate-800">
                              <span className="w-1.5 h-1.5 rounded-full bg-blue-400 mt-2 flex-shrink-0"></span><span>{point}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {selectedNode.info?.formula && (
                      <div className="p-4 bg-indigo-950/40 border border-indigo-500/30 rounded-xl space-y-2">
                        <div className="flex items-center gap-2 text-indigo-300 font-semibold text-xs uppercase tracking-wider"><Icon name="binary" className="w-4 h-4 text-indigo-400" /> <span>Rumus & Reaksi Kimia</span></div>
                        <pre className="text-sm font-mono text-indigo-200 whitespace-pre-wrap leading-relaxed bg-slate-950/60 p-3 rounded-lg border border-indigo-900/50">{selectedNode.info.formula}</pre>
                      </div>
                    )}

                    {/* VIRTUAL LAB INTEGRATION BUTTON */}
                    {(selectedNode.labLink || selectedNode.isLabNode) && (
                      <div className="mt-8 p-4 bg-gradient-to-r from-slate-900 to-red-950/40 rounded-xl border border-red-900/50 shadow-lg text-center">
                         <h4 className="text-sm font-bold text-red-400 mb-2 flex items-center justify-center gap-2"><Icon name="flask-conical" className="w-4 h-4"/> Uji Praktikum Tersedia</h4>
                         <button 
                           onClick={() => {
                             setActiveExp(selectedNode.labLink || 1);
                             // Buka mode lab dengan menyetel state expandedNodes ke [root, 9]
                             setExpandedNodes(['root', '9']);
                             setZoom(1);
                             setPan({x:0, y:0});
                           }}
                           className="w-full py-3 bg-red-600 hover:bg-red-500 text-white rounded-lg font-bold transition shadow-md flex items-center justify-center gap-2"
                         >
                            Buka Virtual Lab Asam Basa
                         </button>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="h-full flex flex-col items-center justify-center text-center text-slate-500 space-y-3">
                    <Icon name="mouse-pointer-click" className="w-10 h-10 text-slate-600 animate-bounce" />
                    <p className="text-sm">Klik salah satu kotak mind map di sebelah kiri untuk melihat detail materi.</p>
                  </div>
                )}
              </div>

              <div className="p-4 bg-slate-950 border-t border-slate-800 text-center text-xs text-slate-500">Media Interaktif Kimia • Asam dan Basa</div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex flex-col h-screen w-screen bg-slate-950 overflow-hidden relative">
          
          {/* HEADER ATAS */}
          <header className="flex-none relative z-50 flex items-center justify-between px-6 py-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 shadow-md">
            <div className="flex items-center gap-3">
              <div className="p-2.5 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl shadow-lg shadow-blue-500/30">
                <Icon name="atom" className="w-6 h-6 text-white animate-spin-slow" />
              </div>
              <div>
                <h1 className="text-xl font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">
                  Mind Map & Lab Asam Basa
                </h1>
                <p className="text-xs text-slate-400 hidden sm:block">Media Pembelajaran Interaktif Kimia SMA</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button 
                onClick={handleResetMap}
                className="flex items-center gap-2 px-3 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition-all shadow-md active:scale-95"
              >
                <Icon name="rotate-ccw" className="w-4 h-4 text-blue-400" />
                <span className="hidden sm:inline">Reset Map</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 relative overflow-hidden">
             {renderContent()}
          </main>

        </div>
      );
    }

    // Render Aplikasi React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
